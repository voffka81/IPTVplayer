name: Android APK build

on:
  pull_request:
    paths:
      - '.github/workflows/android-ci.yml'
      - 'TV Player MAUI/**'
      - 'TV Player Core/**'
      - 'TV Player Plugin.Abstractions/**'
      - 'global.json'
      - 'NuGet.Config'
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'TV Player MAUI/**'
      - 'TV Player Core/**'
      - 'TV Player Plugin.Abstractions/**'
      - 'global.json'
      - 'NuGet.Config'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android .NET workload
        run: dotnet workload restore "TV Player MAUI/TV Player MAUI.csproj"

      - name: Prepare and verify Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Set repository secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set repository secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Set repository secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Set repository secret ANDROID_KEY_PASSWORD}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iptv-release.p12"
          keytool -list \
            -keystore "$RUNNER_TEMP/iptv-release.p12" \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/iptv-release.p12" \
            -srcstoretype PKCS12 \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/iptv-release.jks" \
            -deststoretype JKS \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -destkeypass "$ANDROID_KEY_PASSWORD" \
            -destalias "$ANDROID_KEY_ALIAS" >/dev/null
          keytool -list \
            -keystore "$RUNNER_TEMP/iptv-release.jks" \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Private key and alias imported and verified for APK signing."

      - name: Publish APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          : "${ANDROID_KEYSTORE_PASSWORD:?Set repository secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Set repository secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Set repository secret ANDROID_KEY_PASSWORD}"

          publish_args=(
            "TV Player MAUI/TV Player MAUI.csproj"
            --configuration Release
            --framework net10.0-android
            --verbosity normal
            --property:AndroidPackageFormat=apk
            --property:ApplicationVersion="$GITHUB_RUN_NUMBER"
            --output artifacts/android
            --property:AndroidKeyStore=true
            --property:AndroidSigningKeyStore="$RUNNER_TEMP/iptv-release.jks"
            --property:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
            --property:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
            --property:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
            --property:AndroidApkSignerAdditionalArguments=--ks-type\ JKS
          )

          dotnet publish "${publish_args[@]}"

      - name: Normalize APK filename
        shell: bash
        run: |
          mapfile -t apks < <(find artifacts/android -maxdepth 1 -type f -name '*-Signed.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then
            printf 'Expected one signed APK, found %s\n' "${#apks[@]}"
            find artifacts/android -maxdepth 1 -type f -print
            exit 1
          fi
          mv "${apks[0]}" artifacts/IPTVplayer-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVplayer-android-apk
          path: artifacts/IPTVplayer-android.apk
          if-no-files-found: error
          retention-days: 30
