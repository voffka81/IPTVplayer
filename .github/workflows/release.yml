name: Publish unified release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

      channel:
        description: Update channel
        required: true
        type: choice
        default: Release
        options:
          - Release
          - Dev

permissions:
  contents: write

concurrency:
  group: unified-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      code: ${{ steps.compute.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release version and metadata policy
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Calculate next shared version
        id: compute
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, subprocess, sys, xml.etree.ElementTree as ET
          sys.path.insert(0, "scripts")
          from android_release import next_version, version_code, published_codes
          versions = []
          for path, key in [
              ("TV Player Avalonia/TV Player Avalonia.csproj", "Version"),
              ("TV Player MAUI/TV Player MAUI.csproj", "ApplicationDisplayVersion"),
          ]:
              root = ET.parse(path).getroot()
              versions.append(next((n.text or "").strip() for n in root.iter(key) if (n.text or "").strip()))
          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          version = next_version(versions, tags, os.environ["BUMP"])
          code = version_code(published_codes())
          if os.environ["CHANNEL"] == "Dev":
              version += f"-dev.{code}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\ntag=v{version}\ncode={code}\n")
          print(f"Next release: v{version}, Android code {code}")
          PY
      - name: Reject existing release tag
        env:
          RELEASE_TAG: ${{ steps.compute.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run tests
        run: dotnet test "TV Player Tests/TV Player Tests.csproj" --configuration Release
      - name: Publish Windows
        run: >-
          dotnet publish "TV Player Avalonia/TV Player Avalonia.csproj"
          --configuration Release --runtime win-x64 --self-contained true
          -p:Version=${{ needs.version.outputs.version }}
          --output publish
      - name: Archive Windows
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "publish\*" -DestinationPath "artifacts/IPTVplayer-$env:RELEASE_VERSION-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/*.zip
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload restore "TV Player MAUI/TV Player MAUI.csproj"
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iptv-release.p12"
          alias=$(keytool -list -v -keystore "$RUNNER_TEMP/iptv-release.p12" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" | awk -F ': ' '/^Alias name:/{print $2; exit}')
          test -n "$alias"
          keytool -importkeystore -noprompt -srckeystore "$RUNNER_TEMP/iptv-release.p12" -srcstoretype PKCS12 -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" -srcalias "$alias" -srckeypass "$ANDROID_KEY_PASSWORD" -destkeystore "$RUNNER_TEMP/iptv-release.jks" -deststoretype JKS -deststorepass "$ANDROID_KEYSTORE_PASSWORD" -destkeypass "$ANDROID_KEY_PASSWORD" -destalias "$alias"
          echo "ANDROID_SIGNING_ALIAS=$alias" >> "$GITHUB_ENV"
      - name: Publish signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          android_version_code="${{ needs.version.outputs.code }}"
          dotnet publish "TV Player MAUI/TV Player MAUI.csproj" \
            --configuration Release --framework net10.0-android \
            --property:AndroidPackageFormat=apk \
            --property:ApplicationDisplayVersion="$RELEASE_VERSION" \
            --property:ApplicationVersion="$android_version_code" \
            --output artifacts/android \
            --property:AndroidKeyStore=true \
            --property:AndroidSigningKeyStore="$RUNNER_TEMP/iptv-release.jks" \
            --property:AndroidSigningKeyAlias="$ANDROID_SIGNING_ALIAS" \
            --property:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            --property:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
            --property:AndroidApkSignerAdditionalArguments=--ks-type\ JKS
      - name: Normalize signed APK
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find artifacts/android -maxdepth 1 -type f -name '*-Signed.apk')
          test "${#apks[@]}" -eq 1
          mkdir -p artifacts/release
          mv "${apks[0]}" "artifacts/release/IPTVplayer-android-$RELEASE_VERSION.apk"
          python scripts/check_android_apk.py "artifacts/release/IPTVplayer-android-$RELEASE_VERSION.apk"
          python scripts/android_release.py "artifacts/release/IPTVplayer-android-$RELEASE_VERSION.apk" "$RELEASE_VERSION" "${{ needs.version.outputs.code }}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/release/*
          if-no-files-found: error

  release:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: artifacts
          merge-multiple: true
      - name: Publish one GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          UPDATE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "artifacts/IPTVplayer-$RELEASE_VERSION-win-x64.zip"
          test -f "artifacts/IPTVplayer-android-$RELEASE_VERSION.apk"
          test -f artifacts/android-update.json
          assets=("artifacts/IPTVplayer-$RELEASE_VERSION-win-x64.zip" "artifacts/IPTVplayer-android-$RELEASE_VERSION.apk" "artifacts/android-update.json")
          if [[ -d "docs/release-assets/$RELEASE_VERSION" ]]; then
            while IFS= read -r -d '' file; do assets+=("$file"); done < <(find "docs/release-assets/$RELEASE_VERSION" -maxdepth 1 -name '*.png' -type f -print0)
          fi
          release_flags=(--latest)
          if [[ "$UPDATE_CHANNEL" == "Dev" ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "IPTV Player $RELEASE_VERSION" \
            --generate-notes \
            "${release_flags[@]}"
