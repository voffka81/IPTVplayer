name: Publish Windows release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare project version with previous commit
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          project = Path("TV Player Avalonia/TV Player Avalonia.csproj")

          def read_version(text):
              root = ET.fromstring(text)
              for group in root.findall("PropertyGroup"):
                  value = group.findtext("Version")
                  if value and value.strip():
                      return value.strip()
              return ""

          current_version = read_version(project.read_text(encoding="utf-8"))
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", current_version):
              raise SystemExit(f"Invalid or missing <Version> in {project}: {current_version!r}")

          before_sha = os.environ["BEFORE_SHA"]
          previous_version = ""
          if before_sha and set(before_sha) != {"0"}:
              previous_xml = subprocess.run(
                  ["git", "show", f"{before_sha}:{project.as_posix()}"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if previous_xml.returncode == 0:
                  previous_version = read_version(previous_xml.stdout)

          changed = current_version != previous_version
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={current_version}\n")
              output.write(f"changed={str(changed).lower()}\n")

          print(f"Previous version: {previous_version or '(unset)'}")
          print(f"Current version: {current_version}")
          print(f"Release required: {changed}")
          PY

  publish-windows:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out versioned source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test "TV Player Tests/TV Player Tests.csproj" --configuration Release

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish "TV Player Avalonia/TV Player Avalonia.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish

      - name: Package release archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $archive = "artifacts/IPTVplayer-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path "publish\*" -DestinationPath $archive -CompressionLevel Optimal

      - name: Create version tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $assets = @("artifacts/IPTVplayer-$env:RELEASE_VERSION-win-x64.zip")
          $screenshotDirectory = Join-Path "docs/release-assets" $env:RELEASE_VERSION
          $screenshots = @()
          if (Test-Path -LiteralPath $screenshotDirectory) {
            $screenshots = @(Get-ChildItem -LiteralPath $screenshotDirectory -Filter "*.png" -File)
            foreach ($screenshot in $screenshots) {
              $assets += $screenshot.FullName
            }
          }

          $createArgs = @("release", "create", $env:RELEASE_VERSION) + $assets + @(
            "--target", $env:GITHUB_SHA,
            "--generate-notes"
          )
          & gh @createArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }

          if ($screenshots.Count -gt 0) {
            $releaseBody = gh release view $env:RELEASE_VERSION --json body --jq .body
            if ($LASTEXITCODE -ne 0) { throw "Could not read generated release notes." }
            $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$env:RELEASE_VERSION.md"
            Set-Content -LiteralPath $notesFile -Value $releaseBody -Encoding utf8
            Add-Content -LiteralPath $notesFile -Value "`n## Screenshots`n"
            foreach ($screenshot in $screenshots) {
              $label = switch ($screenshot.BaseName) {
                "channel-picker" { "Channel picker" }
                "player" { "Player" }
                default { $screenshot.BaseName }
              }
              $imageUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_VERSION/$($screenshot.Name)"
              Add-Content -LiteralPath $notesFile -Value "![${label}]($imageUrl)`n"
            }
            & gh release edit $env:RELEASE_VERSION --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "Could not add screenshots to the release notes." }
          }
